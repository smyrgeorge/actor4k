<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="actor4k — a small actor system for Kotlin, built on coroutines" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171A3D"/>
      <stop offset="1" stop-color="#232659"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2E3270" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="320" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)" opacity="0.55"/>
    <rect x="0" y="0" width="8" height="320" fill="#F28C82"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="84" y="168" font-size="104" font-weight="700" fill="#E6E8FA" letter-spacing="-3">actor4k<tspan fill="#F28C82">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
    <text x="88" y="230" font-size="20" fill="#A9AEDB">Small actor system for Kotlin, built on coroutines</text>

    <!-- mailbox card -->
    <g transform="translate(772 64)">
      <rect width="428" height="192" rx="12" fill="#12152F" stroke="#3A3F86"/>
      <text x="24" y="38" font-size="14" fill="#F28C82">ActorSystem.get(<tspan fill="#E6E8FA">Account</tspan>::class, <tspan fill="#B9B3FF">"ACC0010"</tspan>)</text>
      <line x1="24" y1="56" x2="404" y2="56" stroke="#3A3F86"/>
      <text x="24" y="82" font-size="15" fill="#7479B0">op</text>
      <text x="96" y="82" font-size="15" fill="#7479B0">message</text>
      <text x="404" y="82" font-size="15" fill="#7479B0" text-anchor="end">reply</text>
      <line x1="24" y1="94" x2="404" y2="94" stroke="#2A2E66" stroke-dasharray="3 4"/>
      <text x="24" y="120" font-size="16" fill="#F28C82">tell</text>
      <text x="96" y="120" font-size="16" fill="#E6E8FA">Deposit(100)</text>
      <text x="404" y="120" font-size="16" fill="#7479B0" text-anchor="end">queued</text>
      <text x="24" y="146" font-size="16" fill="#F28C82">tell</text>
      <text x="96" y="146" font-size="16" fill="#E6E8FA">Withdraw(40)</text>
      <text x="404" y="146" font-size="16" fill="#7479B0" text-anchor="end">queued</text>
      <text x="24" y="172" font-size="16" fill="#7CD4B4">ask</text>
      <text x="96" y="172" font-size="16" fill="#E6E8FA">GetBalance</text>
      <text x="404" y="172" font-size="16" fill="#7CD4B4" text-anchor="end">60</text>
    </g>
    <text x="1200" y="284" font-size="14" fill="#5D629C" text-anchor="end">(one mailbox, one message at a time)</text>
  </g>
</svg>
